<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多模态金融文档智能问答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=12" />
</head>
<body>
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo">金</div>
        <div>
          <div class="logo-title">金融文档问答</div>
          <div class="logo-sub">Enterprise RAG</div>
        </div>
      </div>

      <button type="button" class="btn-new" id="btnNew">＋ 新对话</button>

      <nav class="side-nav">
        <div class="nav-label">能力</div>
        <div class="nav-item active">文档问答</div>
        <div class="nav-item muted">多格式解析</div>
        <div class="nav-item muted">证据溯源</div>
        <div class="nav-item muted">拒答防幻觉</div>
      </nav>

      <div class="side-settings">
        <div class="nav-label">设置</div>
        <label class="set-row">
          <span>显示思考过程</span>
          <input type="checkbox" id="showThinking" />
        </label>
      </div>

      <div class="side-foot">
        <div class="status-dot" id="statusDot"></div>
        <div>
          <div id="status" class="status-text">引擎加载中…</div>
          <div id="meta" class="meta-text">等待服务就绪</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1>基于多模态金融文档的智能问答</h1>
          <p class="topbar-desc">答案均附可追溯证据 · 证据不足时明确拒答</p>
        </div>
        <div class="topbar-tags">
          <span class="tag">DocIR</span>
          <span class="tag">双引擎检索</span>
          <span class="tag">Document Agent</span>
        </div>
      </header>

      <section class="thread" id="chat" aria-live="polite"></section>

      <section class="suggest-wrap" id="suggestWrap">
        <div class="suggest-title">多类型示例（覆盖复赛题型，可点击）</div>
        <div class="suggest-grid" id="chips"></div>
      </section>

      <footer class="input-dock">
        <form id="form" class="input-box">
          <textarea
            id="input"
            rows="1"
            placeholder="向知识库提问… 例如：请说明基金功能的主要服务内容以及认购操作流程"
            maxlength="2000"
            required
          ></textarea>
          <div class="input-actions">
            <span class="input-hint">Enter 发送 · Shift+Enter 换行</span>
            <button type="submit" id="send">发送</button>
          </div>
        </form>
        <p class="disclaimer">内容由检索增强生成，请以原始业务文档为准。演示环境可能使用精简知识库。</p>
      </footer>
    </main>
  </div>
  <script src="/static/app.js?v=13"></script>
</body>
</html>
