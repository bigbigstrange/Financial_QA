name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.17.4
      - name: Syntax / undefined-name check
        run: ruff check --select E9,F63,F7,F82 --output-format=concise .

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libs (OpenCV / Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 tesseract-ocr

      - name: Install CPU-only torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.1.0 torchvision==0.16.0

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        id: pytest
        continue-on-error: true
        env:
          FINANCE_DISABLE_PAID_API: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          pytest -q --tb=line 2>&1 | tee pytest.log

      - name: Annotate failures
        if: steps.pytest.outcome == 'failure'
        run: |
          grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          echo "---- last 25 lines ----"
          tail -25 pytest.log

      - name: Fail job on test failure
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

