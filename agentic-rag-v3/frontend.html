<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic RAG Chat</title>

<style>
/* ══════════════════════════════════════════════════════════
   Red Theme — CSS Tokens
   ══════════════════════════════════════════════════════════ */
html[data-theme="dark"] {
  --primary-color: #c0392b;
  --color-link: #d4837a;
  --color-success: #a04040;
  --color-danger: #e74c3c;
  --color-warning: #d4a070;
  --app-background: #0d0808;
  --sidebar-background: #130c0c;
  --background-title: #180e0e;
  --background-code: #1a1010;
  --background-hover: rgba(200,100,100,.08);
  --background-disabled: #120a0a;
  --popover-background: #1a1010;
  --text-primary: #d4b0b0;
  --text-secondary: #9a7070;
  --text-disabled: #5a3a3a;
  --text-highlight: #f0d0d0;
  --border-color: #2a1515;
  --border-input: #3a2020;
  --chat-input-background: #140c0c;
  --chat-input-border: #3a2020;
  --progress-line: #3a1a1a;
  --user-msg-background: #1f1212;
  --assistant-msg-background: #180e0e;
  --color-blue: #c08080;
  --color-green: #a05050;
  --color-red: #e74c3c;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body { height:100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#6a4040; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#8a5050; }

/* ── Brand Header ──────────────────────────────────── */
.brand-header {
  display:flex; align-items:center; justify-content:space-between;
  height:56px; min-height:56px; padding:0 20px;
  background:#1a0e0e; border-bottom:1px solid #3a1818;
  color:#e0d0d0; font-size:13px; font-weight:500;
  letter-spacing:.3px; z-index:100; flex-shrink:0;
}
.brand-header-left { display:flex; align-items:center; gap:12px; }
.brand-logo {
  width:44px; height:44px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.brand-logo svg { width:44px; height:44px; }
.brand-title { font-weight:600; font-size:14px; color:#e0d0d0; }
.brand-tagline { color:#9a7070; font-size:11px; font-weight:400; margin-left:4px; }
.brand-header-right { display:flex; align-items:center; gap:12px; font-size:11px; color:#8a6060; }
.brand-status { display:flex; align-items:center; gap:6px; }
.brand-dot { width:6px; height:6px; background:#8a5050; border-radius:50%; box-shadow:0 0 4px rgba(200,100,100,.15); }
.brand-dot.online { background:#d44; box-shadow:0 0 8px rgba(220,60,60,.5); }

/* ── Layout ────────────────────────────────────────── */
#app-wrapper { display:flex; flex-direction:column; height:100%; overflow:hidden; }
#main-content { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--app-background); }

/* ── Chat Area ─────────────────────────────────────── */
.chat-container { flex:1; display:flex; flex-direction:column; min-height:0; max-width:900px; margin:0 auto; width:100%; padding:0 20px; }
.messages { flex:1; overflow-y:auto; padding:24px 0; min-height:0; }

.message { margin-bottom:20px; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.msg-user, .msg-assistant { display:flex; gap:12px; max-width:85%; }
.msg-user { margin-left:auto; flex-direction:row-reverse; }
.msg-assistant { margin-right:auto; }

.msg-avatar {
  width:32px; height:32px; border-radius:6px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700;
}
.msg-user .msg-avatar { background:#5a2a2a; color:#d4b0b0; }
.msg-assistant .msg-avatar { background:#3a1a1a; border:1px solid #4a2020; color:#b09090; }

.msg-bubble {
  padding:12px 16px; border-radius:10px; font-size:14px; line-height:1.6;
  word-break:break-word;
}
.msg-user .msg-bubble { background:var(--user-msg-background); color:var(--text-primary); border:1px solid var(--border-color); }
.msg-assistant .msg-bubble { background:var(--assistant-msg-background); color:var(--text-primary); border:1px solid var(--border-color); }

.msg-bubble p { margin:0 0 8px 0; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code { background:var(--background-code); padding:2px 6px; border-radius:4px; font-size:13px; }
.msg-bubble pre { background:var(--background-code); padding:12px; border-radius:6px; overflow-x:auto; margin:8px 0; font-size:13px; }

/* ── Sources ───────────────────────────────────────── */
.sources { margin-top:8px; }
.source-item {
  font-size:11px; color:var(--text-secondary); padding:4px 8px;
  background:var(--background-code); border-radius:4px;
  margin-top:4px; cursor:pointer; transition:background .15s;
}
.source-item:hover { background:var(--background-hover); }
.source-item .source-label { font-weight:600; color:var(--color-blue); }

/* ── Input Area ────────────────────────────────────── */
.input-area {
  padding:16px 0 20px; border-top:1px solid var(--border-color);
  display:flex; gap:10px; flex-shrink:0;
}
.input-area input {
  flex:1; padding:10px 16px; border-radius:8px; font-size:14px;
  background:var(--chat-input-background); border:1px solid var(--chat-input-border);
  color:var(--text-primary); outline:none; transition:border-color .2s;
}
.input-area input:focus { border-color:var(--primary-color); }
.input-area input::placeholder { color:var(--text-disabled); }
.input-area button {
  padding:10px 20px; background:#8b3a3a; color:#f0d0d0; border:none;
  border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  transition:background .15s; white-space:nowrap;
}
.input-area button:hover { background:#a04040; }
.input-area button:disabled { background:#3a1a1a; color:#6a4040; cursor:not-allowed; }

/* ── Status Bar ────────────────────────────────────── */
.status-bar {
  display:flex; align-items:center; gap:8px; padding:8px 20px;
  font-size:12px; color:var(--text-secondary); min-height:32px;
}
.status-bar .step {
  display:flex; align-items:center; gap:6px;
  padding:3px 10px; border-radius:12px;
  background:var(--background-code); color:var(--text-secondary);
}
.status-bar .step.active { color:var(--text-highlight); background:#3a1818; }
.status-bar .step.done { color:var(--color-green); }
.status-bar .step.error { color:var(--color-red); }

/* ── Welcome Center Logo ───────────────────────────── */
.welcome {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--text-secondary); text-align:center; gap:16px;
}
.welcome-logo {
  width:160px; height:160px;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:8px;
}
.welcome-logo svg { width:160px; height:160px; }
.welcome h2 { color:var(--text-primary); font-size:24px; font-weight:600; }
.welcome p { font-size:14px; max-width:420px; color:#9a7070; line-height:1.6; }

/* ── Code Text Selection Fix ───────────────────────── */
pre, code { -webkit-user-select:text !important; user-select:text !important; }
</style>
</head>
<body>

<div id="app-wrapper">
  <header class="brand-header">
    <div class="brand-header-left">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
          <defs>
            <radialGradient id="reflectionGradient" cx="500" cy="480" r="400" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
              <stop offset="35%" stop-color="#1a0808"/>
              <stop offset="100%" stop-color="#000000"/>
            </radialGradient>
          </defs>
          <g fill="url(#reflectionGradient)" stroke="#c08080" stroke-width="1.2" stroke-linejoin="miter" stroke-linecap="square">
            <polygon points="500,150 280,450 400,480"/>
            <polygon points="500,150 720,450 600,480"/>
            <polygon points="500,150 400,480 500,530"/>
            <polygon points="500,150 600,480 500,530"/>
            <polygon points="280,450 340,660 500,810 500,530 400,480"/>
            <polygon points="720,450 660,660 500,810 500,530 600,480"/>
          </g>
          <g fill="#d4a0a0">
            <polygon points="500,410 550,480 500,550 450,480"/>
            <polygon points="500,430 530,480 500,530 470,480"/>
          </g>
          <g fill="#c08080">
            <circle cx="540" cy="560" r="20"/>
            <circle cx="580" cy="600" r="12"/>
            <circle cx="620" cy="640" r="8"/>
          </g>
        </svg>
      </div>
      <span class="brand-title">Agentic RAG</span>
      <span class="brand-tagline">Self-Corrective Research Assistant</span>
    </div>
    <div class="brand-header-right">
      <div class="brand-status">
        <span class="brand-dot online" id="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
      <span>v1.0</span>
    </div>
  </header>

  <div id="main-content">
    <div class="chat-container">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
              <defs>
                <radialGradient id="welcomeReflectionGradient" cx="500" cy="480" r="400" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                  <stop offset="35%" stop-color="#1a0808"/>
                  <stop offset="100%" stop-color="#000000"/>
                </radialGradient>
              </defs>
              <g fill="url(#welcomeReflectionGradient)" stroke="#c08080" stroke-width="1.2" stroke-linejoin="miter" stroke-linecap="square">
                <polygon points="500,150 280,450 400,480"/>
                <polygon points="500,150 720,450 600,480"/>
                <polygon points="500,150 400,480 500,530"/>
                <polygon points="500,150 600,480 500,530"/>
                <polygon points="280,450 340,660 500,810 500,530 400,480"/>
                <polygon points="720,450 660,660 500,810 500,530 600,480"/>
              </g>
              <g fill="#d4a0a0">
                <polygon points="500,410 550,480 500,550 450,480"/>
                <polygon points="500,430 530,480 500,530 470,480"/>
              </g>
              <g fill="#c08080">
                <circle cx="540" cy="560" r="20"/>
                <circle cx="580" cy="600" r="12"/>
                <circle cx="620" cy="640" r="8"/>
              </g>
            </svg>
          </div>
          <h2>Agentic RAG</h2>
          <p>Ask about agents, prompt engineering, or AI topics. The system retrieves, grades, and generates grounded answers — with self-correction.</p>
        </div>
      </div>
      <div class="status-bar" id="status-bar"></div>
      <div class="input-area">
        <input type="text" id="question-input" placeholder="Ask about agent memory, RAG, prompt engineering..." autofocus>
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const statusBar = document.getElementById('status-bar');
const questionInput = document.getElementById('question-input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const welcomeEl = document.getElementById('welcome');

let isStreaming = false;

const STEP_LABELS = {
  route_question: 'Routing',
  retrieve: 'Retrieving',
  grade_documents: 'Grading',
  websearch: 'Searching',
  generate: 'Generating',
};

function hideWelcome() {
  if (welcomeEl) { welcomeEl.style.display = 'none'; }
}

function addMessage(role, content, sources) {
  hideWelcome();
  const div = document.createElement('div');
  div.className = 'message';
  const avatarLetter = role === 'user' ? 'U' : 'A';
  const avatarHtml = `<div class="msg-avatar">${avatarLetter}</div>`;
  let sourcesHtml = '';
  if (sources && sources.length > 0) {
    sourcesHtml = '<div class="sources">' + sources.map((s, i) =>
      `<div class="source-item" title="${escapeHtml(s.content)}"><span class="source-label">Source ${i + 1}</span> &mdash; ${escapeHtml(s.source || 'document')}</div>`
    ).join('') + '</div>';
  }
  const escapedContent = escapeHtml(content).replace(/\n/g, '<br>');
  div.innerHTML = `<div class="msg-${role}">${avatarHtml}<div class="msg-bubble">${escapedContent}${sourcesHtml}</div></div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function escapeHtml(str) {
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return String(str).replace(/[&<>"']/g, c => map[c]);
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function setStatus(steps) {
  statusBar.innerHTML = steps.map(s => `<span class="step ${s.status}">${s.label}</span>`).join('');
}

function setDot(online) {
  statusDot.className = online ? 'brand-dot online' : 'brand-dot';
  statusText.textContent = online ? 'Processing' : 'Ready';
}

async function sendMessage() {
  const question = questionInput.value.trim();
  if (!question || isStreaming) return;
  isStreaming = true;
  questionInput.disabled = true;
  sendBtn.disabled = true;
  setDot(true);
  addMessage('user', question);

  const activeSteps = [];
  setStatus(activeSteps);

  let assistantContent = '';
  let sources = [];
  let msgDiv = null;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question}),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        const {node, data: payload} = data;
        if (node === 'done') {}
        else if (node === 'error') {
          addMessage('assistant', 'Error: ' + (payload || 'Unknown error'));
        } else {
          const label = STEP_LABELS[node] || node;
          const existing = activeSteps.find(s => s.key === node);
          if (!existing) {
            if (node === 'websearch' || node === 'grade_documents') {
              activeSteps.forEach(s => { if (s.status === 'active') s.status = 'done'; });
            }
            activeSteps.push({key: node, label, status: 'active'});
          }
          if (node === 'generate' && payload && payload.generation) {
            if (!msgDiv) { hideWelcome(); msgDiv = createAssistantBubble(); }
            assistantContent = payload.generation;
            msgDiv.querySelector('.msg-bubble').innerHTML = escapeHtml(assistantContent).replace(/\n/g, '<br>');
            scrollToBottom();
          }
          if (payload && payload.documents) {
            sources = payload.documents;
            if (msgDiv) { updateSources(msgDiv, sources); }
          }
        }
        setStatus(activeSteps);
      }
    }
    activeSteps.forEach(s => s.status = 'done');
    setStatus(activeSteps);
    if (!msgDiv && assistantContent) { addMessage('assistant', assistantContent, sources); }
    else if (!msgDiv && !assistantContent) { addMessage('assistant', 'No response generated.'); }
  } catch (err) {
    addMessage('assistant', 'Connection error: ' + err.message);
  }
  isStreaming = false;
  questionInput.disabled = false;
  sendBtn.disabled = false;
  questionInput.focus();
  questionInput.value = '';
  setDot(false);
  setTimeout(() => setStatus([]), 3000);
}

function createAssistantBubble() {
  hideWelcome();
  const div = document.createElement('div');
  div.className = 'message';
  div.innerHTML = `<div class="msg-assistant"><div class="msg-avatar">A</div><div class="msg-bubble"></div></div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function updateSources(msgDiv, sources) {
  if (!sources.length) return;
  let bubble = msgDiv.querySelector('.msg-bubble');
  let existingSources = bubble.querySelector('.sources');
  if (existingSources) existingSources.remove();
  const sourcesDiv = document.createElement('div');
  sourcesDiv.className = 'sources';
  sources.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'source-item';
    item.title = escapeHtml(s.content || '');
    item.innerHTML = `<span class="source-label">Source ${i + 1}</span> &mdash; ${escapeHtml(s.source || 'document')}`;
    sourcesDiv.appendChild(item);
  });
  bubble.appendChild(sourcesDiv);
}

questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
